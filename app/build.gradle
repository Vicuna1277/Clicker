apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.vicuna.clicker.root'
    compileSdk 34


    defaultConfig {
        applicationId "com.vicuna.clicker.root"
        minSdk 24
        targetSdk 33
        versionCode 348
        versionName "3.3.18-slim"
        resourceConfigurations += ["zh-rCN", "en"]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Personal arm64 build; RootInput backend boundary remains available for future Shizuku.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            keyAlias System.getenv('KEY_ALIAS') ?: 'key0'
            keyPassword System.getenv('KEY_PASSWORD') ?: '123456'
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'D:/Android/clickdevice_android_root_v3.3.3_click_record_fix/app/ant_build/a123456.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: '123456'
            v2SigningEnabled true
        }

    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    // RootNativeDaemon 需要通过绝对路径 System.load() 加载 .so，
    // 因此强制把 native library 解压到 applicationInfo.nativeLibraryDir。
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }
    dataBinding {
        enabled = false
    }
    viewBinding{
        enabled=true
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}


dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.4.+'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.4.1"
    implementation 'androidx.room:room-runtime:2.4.2'
    annotationProcessor "androidx.room:room-compiler:2.4.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.5.2"
    implementation 'com.github.ming123aaa:ILiveData:1.6'

    implementation 'com.google.code.gson:gson:2.8.6'
    
    // Compose dependencies
    def composeBom = platform('androidx.compose:compose-bom:2023.08.00')
    implementation composeBom
    androidTestImplementation composeBom
    
    // Compose UI
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    
    // Activity & Navigation Compose
    implementation 'androidx.activity:activity-compose:1.7.2'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.1'
    
    // Core
    implementation 'androidx.core:core-ktx:1.10.1'
    
    // Testing
    testImplementation 'androidx.compose.ui:ui-test-junit4'
}
